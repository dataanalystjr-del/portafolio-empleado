<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Portafolio Empleado</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:"Inter",sans-serif;background:#f0f4f8;display:flex;flex-direction:column}
.search-bar{background:#1e3c72;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.search-bar label{color:rgba(255,255,255,.85);font-size:12px;font-weight:600;white-space:nowrap}
.search-bar select{flex:1;padding:7px 10px;border-radius:8px;border:none;font-size:13px;font-family:"Inter",sans-serif;background:rgba(255,255,255,.15);color:white;outline:none;cursor:pointer}
.search-bar select option{background:#1e3c72;color:white}
.search-bar.hidden{display:none}
.container{width:100%;flex:1;overflow-y:auto;overflow-x:hidden}
.header{background:linear-gradient(135deg,#1e3c72 0%,#2a5298 60%,#3b6fd4 100%);color:white;padding:22px 20px 18px;text-align:center;position:relative}
.header::after{content:"";position:absolute;bottom:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#667eea,#764ba2,#f093fb,#667eea);background-size:200% auto;animation:shimmer 3s linear infinite}
@keyframes shimmer{to{background-position:200% center}}
.logo-container{display:flex;justify-content:center;align-items:center;margin-bottom:12px}
.company-logo{max-width:140px;max-height:60px;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(0,0,0,.3))}
.employee-name{font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;line-height:1.2;margin-bottom:6px}
.employee-title{font-size:10px;opacity:.9;font-weight:500;text-transform:uppercase;letter-spacing:1.8px}
.org-chart{margin-top:12px;padding:8px 16px;background:rgba(255,255,255,.12);border-radius:10px;display:inline-flex;flex-direction:column;gap:3px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15)}
.org-item{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:500}
.status-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-top:8px}
.status-activo{background:#22c55e;color:#fff}
.status-inactivo{background:#ef4444;color:#fff}
.content{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:16px}
.card{background:#fff;border-radius:12px;padding:14px;border-left:3px solid #667eea;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.card-title{font-size:13px;font-weight:700;color:#1e293b;margin-bottom:10px;display:flex;align-items:center;gap:6px;padding-bottom:8px;border-bottom:1px solid #e2e8f0}
.card-icon{font-size:16px}
.info-row{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0;border-bottom:1px solid #f1f5f9;gap:8px}
.info-row:last-child{border-bottom:none}
.info-label{color:#64748b;font-weight:600;font-size:10px;flex-shrink:0}
.info-value{color:#1e293b;font-weight:600;text-align:right;font-size:10px;word-break:break-word}
.info-value.hl{color:#2a5298;font-weight:700}
.card-full{grid-column:1/-1}
.footer{background:#1e293b;color:rgba(255,255,255,.7);text-align:center;padding:10px;font-size:10px;font-weight:500}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:400px;color:#94a3b8;gap:12px}
.empty-icon{font-size:48px}
.empty-text{font-size:14px;font-weight:500}
.container::-webkit-scrollbar{width:5px}
.container::-webkit-scrollbar-thumb{background:#667eea;border-radius:3px}
</style>
</head>
<body>
<div class="search-bar">
  <label>👤 Empleado:</label>
  <select id="empSel" onchange="render(this.value)">
    <option value="">— Seleccione un empleado —</option>
  </select>
</div>
<div class="container" id="mainContainer">
  <div class="empty-state">
    <div class="empty-icon">👤</div>

  </div>
</div>

function esc(s){if(!s||s==="-")return"-";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function row(lbl,val,hl){
  var cls=hl?"info-value hl":"info-value";
  return "<div class=\"info-row\"><span class=\"info-label\">"+lbl+"</span><span class=\""+cls+"\">"+esc(val)+"</span></div>";
}
function card(ico,title,rows,full){
  var cls=full?"card card-full":"card";
  return "<div class=\""+cls+"\"><div class=\"card-title\"><span class=\"card-icon\">"+ico+"</span>"+title+"</div>"+rows+"</div>";
}
function render(nombre){
  var c=document.getElementById("mainContainer");
  if(!nombre){c.innerHTML="<div class=\"empty-state\"><div class=\"empty-icon\">👤</div><div class=\"empty-text\">Seleccione un empleado</div></div>";return;}
  var e=EMPLOYEES.find(function(x){return x.nombre===nombre;});
  if(!e){c.innerHTML="<div class=\"empty-state\"><div class=\"empty-icon\">⚠️</div><div class=\"empty-text\">Empleado no encontrado</div></div>";return;}
  var sc=e.estado.toLowerCase()==="activo"?"status-activo":"status-inactivo";
  var h="";
  h+="<div class=\"header\">";
  h+="<div class=\"logo-container\"><img class=\"company-logo\" src=\""+e.logo+"\" alt=\"\" onerror=\"this.style.display='none'\"></div>";
  h+="<h1 class=\"employee-name\">"+esc(e.nombre)+"</h1>";
  h+="<p class=\"employee-title\">"+esc(e.cargo)+"</p>";
  h+="<div class=\"org-chart\"><div class=\"org-item\">🏢 <strong>"+esc(e.division)+"</strong></div><div class=\"org-item\">📂 <strong>"+esc(e.area)+"</strong></div><div class=\"org-item\">🎯 <strong>"+esc(e.cargo)+"</strong></div></div>";
  h+="<div><span class=\"status-badge "+sc+"\">"+esc(e.estado)+"</span></div>";
  h+="</div>";
  h+="<div class=\"content\">";
  h+=card("👤","Datos Personales",
    row("🪪 Doc.",e.tipoDoc+": "+e.numDoc)+
    row("📞 Teléfono",e.telefono)+
    row("🎂 Edad",e.edad)+
    row("⚧ Sexo",e.sexo)+
    row("💍 Estado Civil",e.estadoCivil)+
    row("📧 Email",e.email)
  );
  h+=card("💼","Perfil Profesional",
    row("🎯 Cargo",e.cargo,true)+
    row("🏢 División",e.division)+
    row("📂 Área",e.area)+
    row("📋 Sub-área",e.subarea)+
    row("📍 Ciudad",e.municipio+(e.depto!=="-"?", "+e.depto:""))
  );
  h+=card("📅","Contratación",
    row("📆 Ingreso",e.fechaIngreso)+
    row("⏳ Antigüedad",e.antiguedad,true)+
    row("📄 Contrato",e.contrato)+
    row("📅 Vencimiento",e.fechaVenc)+
    row("⏰ Horas/Sem",e.horasSemanales)
  );
  h+=card("🏥","Seguridad Social",
    row("🏥 EPS",e.eps)+
    row("💰 AFP",e.afp)+
    row("📁 Cesantías",e.cesantias)+
    row("🛡️ ARL",e.arl)
  );
  h+=card("💳","Información de Pago",
    row("💵 Salario Base",e.salario,true)+
    row("📊 Tipo Salario",e.tipoSalario)+
    row("🏦 Banco",e.banco)+
    row("🔢 N° Cuenta",e.numCuenta+" ("+e.tipoCuenta+")")+
    row("💳 Forma Pago",e.formaPago)
  );
  h+=card("📍","Ubicación",
    row("🏠 Dirección",e.direccion)+
    row("🌆 Ciudad",e.municipio)+
    row("🗺️ Departamento",e.depto)
  );
  h+="</div>";
  h+="<div class=\"footer\">© 2025 "+esc(e.empresa)+" | Sistema de Gestión de Personal &middot; Confidencial</div>";
  c.innerHTML=h;
}
function initSel(){
  var sel=document.getElementById("empSel");
  var byEmp={};
  EMPLOYEES.forEach(function(e){if(!byEmp[e.empresa])byEmp[e.empresa]=[];byEmp[e.empresa].push(e.nombre);});
  Object.keys(byEmp).sort().forEach(function(emp){
    var og=document.createElement("optgroup");og.label=emp;
    byEmp[emp].sort().forEach(function(n){var o=document.createElement("option");o.value=n;o.textContent=n;og.appendChild(o);});
    sel.appendChild(og);
  });
}
function fromURL(){
  var p=new URLSearchParams(window.location.search);
  var n=p.get("nombre");
  if(n){
    var d=decodeURIComponent(n).replace(/%20/g," ");
    document.getElementById("empSel").value=d;
    render(d);
    document.querySelector(".search-bar").classList.add("hidden");
    return true;
  }
  return false;
}
window.addEventListener("message",function(ev){
  if(ev.data&&ev.data.type==="employee"){document.getElementById("empSel").value=ev.data.nombre;render(ev.data.nombre);}
});
initSel();
fromURL();
</script>
